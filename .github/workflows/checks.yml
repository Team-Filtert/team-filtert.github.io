name: Check for plain JS files

on:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
            - '**/*.js'
            - '**/*.cjs'
            - '**/*.mjs'

jobs:
    js-comment:
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@v6
              with:
                persist-credentials: false

            - name: Note on PR
              run: |
                gh pr comment ${{ github.event.number }} --edit-last --create-if-none -F ".github/resources/js-files-note.md"
